services:
  - type: web
    name: samadhan-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -b 0.0.0.0:$PORT -k uvicorn.workers.UvicornWorker main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: MONGODB_URL
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        sync: false
      - key: CORS_ORIGINS
        value: https://samadhan-frontend.vercel.app
      - key: PORT
        value: 8000
